components:
  parameters:
    period:
      name: period
      in: query
      required: true
      description: Time period specification for the query
      schema:
        type: object
        properties:
          start:
            type: string
            description: Start date/time (ISO 8601 format)
            example: '2025-01-01'
          end:
            type: string
            description: End date/time (ISO 8601 format)
            example: '2026-01-01'
          resolution:
            type: string
            enum:
              - 1h
              - 1d
              - 1w
              - 1M
              - 1Y
            description: Temporal resolution
            example: 1h
          aggregation:
            type: string
            enum:
              - sum
              - mean
            description: Aggregation method
            example: sum
        required:
          - start
          - end
          - resolution
          - aggregation
    geography:
      name: geography
      in: query
      required: true
      description: Geographic boundary identifier
      schema:
        type: string
        example: all
    segment:
      name: segment
      in: query
      required: true
      description: Demand segment identifier
      schema:
        type: string
        example: all
    scenarioId:
      name: scenarioId
      in: query
      required: false
      description: Scenario identifier for forecasting
      schema:
        type: string
        example: default
    responseFormat:
      name: format
      in: query
      required: false
      description: Response format
      schema:
        type: string
        enum:
          - json
          - csv
        default: json
    geoFormat:
      name: format
      in: query
      required: false
      description: Geographic data response format
      schema:
        type: string
        enum:
          - json
          - geojson
        default: json
    baseScenario:
      name: baseScenario
      in: query
      required: false
      description: Base scenario identifier for Strategy 2
      schema:
        type: string
        example: beslutad-policy
    housing_growth:
      name: housing_growth
      in: query
      required: false
      description: Housing growth parameter index (0=baseline, 1=-15%, 2=-10%, 3=-5%, 4=+5%, 5=+10%, 6=+15%)
      schema:
        type: integer
        minimum: 0
        maximum: 6
        default: 0
    housing_flex:
      name: housing_flex
      in: query
      required: false
      description: Housing flexibility parameter index (0=none)
      schema:
        type: integer
        minimum: 0
        maximum: 2
        default: 0
    transport_growth:
      name: transport_growth
      in: query
      required: false
      description: Transport growth parameter index (0=baseline, 1=-15%, 2=-10%, 3=-5%, 4=+5%, 5=+10%, 6=+15%)
      schema:
        type: integer
        minimum: 0
        maximum: 6
        default: 0
    transport_flex:
      name: transport_flex
      in: query
      required: false
      description: Transport flexibility parameter index (0=none)
      schema:
        type: integer
        minimum: 0
        maximum: 2
        default: 0
    industry_growth:
      name: industry_growth
      in: query
      required: false
      description: Industry growth parameter index (0=baseline, 1=-15%, 2=-10%, 3=-5%, 4=+5%, 5=+10%, 6=+15%)
      schema:
        type: integer
        minimum: 0
        maximum: 6
        default: 0
    industry_flex:
      name: industry_flex
      in: query
      required: false
      description: Industry flexibility parameter index (0=none)
      schema:
        type: integer
        minimum: 0
        maximum: 2
        default: 0
    services_growth:
      name: services_growth
      in: query
      required: false
      description: Services growth parameter index (0=baseline, 1=-15%, 2=-10%, 3=-5%, 4=+5%, 5=+10%, 6=+15%)
      schema:
        type: integer
        minimum: 0
        maximum: 6
        default: 0
    services_flex:
      name: services_flex
      in: query
      required: false
      description: Services flexibility parameter index (0=none)
      schema:
        type: integer
        minimum: 0
        maximum: 2
        default: 0
    datacenters_growth:
      name: datacenters_growth
      in: query
      required: false
      description: Datacenters growth parameter index (0=baseline, 1=-15%, 2=-10%, 3=-5%, 4=+5%, 5=+10%, 6=+15%)
      schema:
        type: integer
        minimum: 0
        maximum: 6
        default: 0
    datacenters_flex:
      name: datacenters_flex
      in: query
      required: false
      description: Datacenters flexibility parameter index (0=none)
      schema:
        type: integer
        minimum: 0
        maximum: 2
        default: 0
