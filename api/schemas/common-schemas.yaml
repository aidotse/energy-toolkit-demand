components:
  schemas:
    GeoFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items: {}   # refine later with full GeoJSON schema if desired

    CsvBinary:
      type: string
      format: binary
      description: Gzipped CSV payload (raw bytes)

    AggregationOption:
      type: object
      required:
        - resolution
        - aggregation
      properties:
        resolution:
          type: string
          description: Time resolution (e.g. "1h", "1d", "1ME", "1YE")
        aggregation:
          description: >
            Either a single aggregation method, or multiple methods supported
            at that resolution.
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    AggregationsResponse:
      type: array
      description: List of available resolution-aggregation combinations
      items:
        $ref: '#/components/schemas/AggregationOption'
