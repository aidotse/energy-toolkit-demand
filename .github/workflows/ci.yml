name: CI

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'api/package-lock.json'

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Run unit tests
        working-directory: ./api
        # Integration tests need parquet files from data/ (gitignored, 16GB).
        # They'll be covered by a follow-up job that syncs from S3; for now
        # CI runs unit tests only and relies on the staging deploy's own
        # health check as the integration smoke test.
        run: npm run test:unit

  explorer-tests:
    name: Explorer tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'explorer/package-lock.json'

      - name: Install dependencies
        working-directory: ./explorer
        run: npm ci

      - name: Run unit tests
        working-directory: ./explorer
        run: npm test

      - name: Build
        working-directory: ./explorer
        env:
          VITE_API_BASE_URL: http://localhost:4010
          VITE_MAPBOX_TOKEN: ''
          VITE_MAPBOX_STYLE_LIGHT: ''
        run: npm run build
