name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: behovskartan-api

jobs:
  # Build and push API Docker image to ECR
  build-api:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

          docker build -f infrastructure/Dockerfile -t ${FULL_IMAGE} .
          docker push ${FULL_IMAGE}

          # Also tag as latest for the environment
          docker tag ${FULL_IMAGE} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  # Deploy API to App Runner
  deploy-api:
    runs-on: ubuntu-latest
    needs: build-api
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to App Runner
        run: |
          aws apprunner update-service \
            --service-arn ${{ vars.APP_RUNNER_SERVICE_ARN }} \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-api.outputs.image_tag }}",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "4010",
                  "RuntimeEnvironmentVariables": {
                    "NODE_ENV": "production",
                    "ALLOWED_ORIGINS": "${{ vars.ALLOWED_ORIGINS }}",
                    "S3_DATA_BUCKET": "${{ vars.S3_DATA_BUCKET }}",
                    "AWS_DEFAULT_REGION": "${{ env.AWS_REGION }}"
                  }
                }
              },
              "AutoDeploymentsEnabled": false
            }'

      - name: Wait for deployment
        run: |
          echo "Waiting for App Runner deployment..."
          aws apprunner wait service-running \
            --service-arn ${{ vars.APP_RUNNER_SERVICE_ARN }} \
            || echo "Service may still be deploying"

  # Build and deploy Explorer to S3 + CloudFront
  deploy-explorer:
    runs-on: ubuntu-latest
    needs: deploy-api
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'explorer/package-lock.json'

      - name: Install dependencies
        working-directory: ./explorer
        run: npm ci

      - name: Build static site
        working-directory: ./explorer
        env:
          VITE_API_BASE_URL: ${{ vars.API_URL }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          VITE_MAPBOX_STYLE_LIGHT: ${{ vars.MAPBOX_STYLE_LIGHT }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: ./explorer
        run: |
          # Sync all files except HTML/JSON with long cache
          aws s3 sync build/ s3://${{ vars.S3_BUCKET_EXPLORER }}/ \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html" \
            --exclude "*.json"

          # Sync HTML and JSON files with short cache
          aws s3 sync build/ s3://${{ vars.S3_BUCKET_EXPLORER }}/ \
            --cache-control "max-age=3600,public" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment complete
        run: |
          echo "Deployment complete!"
          echo "API: ${{ vars.API_URL }}"
          echo "Explorer: https://${{ vars.CLOUDFRONT_DOMAIN }}"
