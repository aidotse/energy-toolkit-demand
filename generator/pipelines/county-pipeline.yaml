# County pipeline configuration
# Contains pipeline-specific parameters not in the main config.yaml

database:
  file: core.duckdb
  default_table: demand

base_data:
  file: base-demand/base-load-curve,aggregation=mean,base-year=2024,geography=00,normalized=False,resolution=1h.csv
  schema:
    geography: geography
    segment: segment
    timestamp: timestamp
    value: value

base_scenario:
  name: default
  include_base_scenario: true
  base_year: 2024
  start_year: 2025
  end_year: 2050

geography_split:
  file: county_energy_split/county_energy_split.csv

segment_processing:
  operations:
    - type: append_constant
      segment: industry
      value: 100
    - type: append_percentage
      from_segment: total
      to_segment: transport
      percentage: 0.15
    - type: append_reminder
      from_segment: total
      exclude_segments: [industry, transport]
      to_segment: housing
    - type: remove
      segment: total

scenario_params:
  housing_electrification:
    type: curve
    geography: all
    segment: housing
    how: multiply
    curve_path_template: scenario_housing_electrification/scenario_housing_electrification,i={value},start_year=2025,end_year=2050.parquet
    parameters: [0, 1, 2, 3, 4]
    default: 2
  transport_electrification:
    type: curve
    geography: all
    segment: transport
    how: multiply
    curve_path_template: scenario_transport_electrification/scenario_transport_electrification,i={value},start_year=2025,end_year=2050.parquet
    parameters: [0, 1, 2, 3, 4]
    default: 2
  industry_transition:
    type: curve
    geography: all
    segment: industry
    how: multiply
    curve_path_template: scenario_industry_transition/scenario_industry_transition,i={value},start_year=2025,end_year=2050.parquet
    parameters: [0, 1, 2]
    default: 1

growth_curve:
  file: scenario_base/scenario_base_growth,start_year=2025,end_year=2050.parquet

partition:
  full_partition: [scenario_id, geography, segment, timestamp_year]

clear_ouptput_flag: false
clear_api_flag: true