# generator/pipelines/county-prototype.yaml
# Data‐generation pipeline for the “county-prototype” project.
#
# Contains everything your generator needs:
#  • base dataset defaults
#  • geography source for geojson outputs
#  • scenario definitions & constraints
#  • transformer sequence
#  • output artifacts to emit
#
# Note: filter (“dimensions”) definitions live in api/parameters.yaml
# and partitioning rules live in generator/partitioning.yaml.

database: 
  file: core.duckdb
  defaultTable: core

base:
  file: base-demand/base-load-curve,aggregation=mean,base-year=2025,geography=SE,normalized=False,resolution=1h.csv
  index: timestamp
  segments: []

# The sequence of data‐transformation steps
transformers:
  - name: county_energy_split
    order: 1
    access: public
    type: factor-split
    randomness: false
    inputs:
      - name: county_energy_split
        path: county_energy_split/county_energy_split.csv
        columns:
          - geography
          - factor
        index: geography

  - name: segment_split
    order: 2
    access: public
    type: factor-split
    inputs: []

  - name: growth_over_time
    order: 3
    access: public
    type: dynamic
    scenarios:
      - index: 0
        label: low
        name: growth
        type: exp-growth-to-target
        target: 2
        random: true
        randomness: 0.1
      - index: 1
        label: mid
        name: growth
        type: exp-growth-to-target
        target: 2.33
        random: true
        randomness: 0.1
      - index: 2
        label: high
        name: growth
        type: exp-growth-to-target
        target: 2.4
        random: true
        randomness: 0.1

