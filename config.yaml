useGenerator: true
useAPI: true
useExplorer: true
name: energy-toolkit-demand
version: 1.0.0
access: public
start: '2025-01-01T00:00:00Z'
end: '2050-12-31T23:00:00Z'
baseResolution: 1h
baseAggregation: mean

# Unit configuration for data values
units:
  energy:
    prefix: G      # SI prefix: '', k, M, G, T (base unit is Wh)
    unit: Wh
  power:
    prefix: G      # SI prefix: '', k, M, G, T (base unit is W)
    unit: W

# Demand segments. Keep the segment names here matched to the profile CSVs
# your generator notebook consumes. The example notebook (coming in v1.0)
# will ship with housing/industry/services as a starting point.
segment:
  description: Segments
  values:
    - name: housing
      label: housing
    - name: industry
      label: industry
    - name: services
      label: services

# Base scenarios are the starting points your generator emits. Each one
# produces a base parquet per segment. Parameters (below) layer on top.
scenario:
  useBaseAsDefaultScenario: true
  scenarios: []  # Strategy 2: base scenarios live under parameters.baseScenarios

# Geographies shown on the map. `file` is the geojson feature collection;
# each entry's `id` must match the feature's `geo_id` property.
# Replace the four toy regions below with your own geography.
geography:
  file: generator/input/example/regions.geojson
  geographies:
    - id: A
      name: Region A
      type: region
    - id: B
      name: Region B
      type: region
    - id: C
      name: Region C
      type: region
    - id: D
      name: Region D
      type: region

# Default map camera — read by explorer/src/lib/mapConfig.ts.
# Replace with the extent of your own geography.
map:
  style: mapbox://styles/mapbox/light-v11
  bounds: [[-1, -1], [5, 5]]
  center: [2, 2]
  zoom: 6
  featureIdProperty: geo_id

generator:
  rowGroupSize: 100000
  partitionKeys:
    - scenario_id
    - geography
    - segment
    - timestamp_year
  profiles:
    noise_amplitude: 0.02
    noise_seed: 42

api:
  resolutions:
    - 1h
    - 1w
    - 1M
    - 1Y
  aggregations:
    - sum
    - mean
    - max

# Parameters are independent multipliers applied at query time.
# See docs and the example notebook for how to author curves.
parameters:
  strategy: 2
  baseScenario: example
  baseScenarios:
    - id: example
      label: Example
      default: true

  definitions:
    housing_growth:
      type: independent
      description: "Housing demand growth (multiplier applied over 2025-2050)"
      segments: [housing]
      geographies: all
      how: multiply
      values:
        - { index: 0, label: "baseline", value: 0,    curve: null }
        - { index: 1, label: "low",      value: -50,  curve: { file: generator/input/example/curves/housing_growth.parquet, filter: "curve_id == 'low'"  } }
        - { index: 2, label: "mid",      value: 0,    curve: { file: generator/input/example/curves/housing_growth.parquet, filter: "curve_id == 'mid'"  } }
        - { index: 3, label: "high",     value: 100,  curve: { file: generator/input/example/curves/housing_growth.parquet, filter: "curve_id == 'high'" } }

    industry_growth:
      type: independent
      description: "Industry demand growth (multiplier applied over 2025-2050)"
      segments: [industry]
      geographies: all
      how: multiply
      values:
        - { index: 0, label: "baseline", value: 0,    curve: null }
        - { index: 1, label: "low",      value: -50,  curve: { file: generator/input/example/curves/industry_growth.parquet, filter: "curve_id == 'low'"  } }
        - { index: 2, label: "mid",      value: 0,    curve: { file: generator/input/example/curves/industry_growth.parquet, filter: "curve_id == 'mid'"  } }
        - { index: 3, label: "high",     value: 100,  curve: { file: generator/input/example/curves/industry_growth.parquet, filter: "curve_id == 'high'" } }

    services_growth:
      type: independent
      description: "Services demand growth (multiplier applied over 2025-2050)"
      segments: [services]
      geographies: all
      how: multiply
      values:
        - { index: 0, label: "baseline", value: 0,    curve: null }
        - { index: 1, label: "low",      value: -50,  curve: { file: generator/input/example/curves/services_growth.parquet, filter: "curve_id == 'low'"  } }
        - { index: 2, label: "mid",      value: 0,    curve: { file: generator/input/example/curves/services_growth.parquet, filter: "curve_id == 'mid'"  } }
        - { index: 3, label: "high",     value: 100,  curve: { file: generator/input/example/curves/services_growth.parquet, filter: "curve_id == 'high'" } }
