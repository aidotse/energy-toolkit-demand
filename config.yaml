useGenerator: true
useAPI: true
useExplorer: true
name: behovskartan2
version: 0.1.0
access: public
start: '2025-01-01T00:00:00Z'
end: '2050-12-31T23:00:00Z'
baseResolution: 1h
baseAggregation: mean
segment:
  description: Segments
  values:
    - name: housing
      label: housing
    - name: transport
      label: transport
    - name: industry
      label: industry
    - name: services
      label: services
    - name: datacenters
      label: datacenters
scenario:
  useBaseAsDefaultScenario: true
  scenarios:
    - name: housing_electrification
      type: index
      items:
        - value: 0
          label: '0'
        - value: 1
          label: '1'
        - value: 2
          label: '2'
        - value: 3
          label: '3'
        - value: 4
          label: '4'
      description: ''
    - name: transport_electrification
      type: index
      items:
        - value: 0
          label: '0'
        - value: 1
          label: '1'
        - value: 2
          label: '2'
        - value: 3
          label: '3'
        - value: 4
          label: '4'
      description: ''
    - name: industry_transition
      type: index
      items:
        - value: 0
          label: '0'
        - value: 1
          label: '1'
        - value: 2
          label: '2'
      description: ''
geography:
  file: generator/input/geographies/sweden-counties.geojson
  geographies:
    - id: '01'
      name: Stockholms län
      type: county
    - id: '03'
      name: Uppsala län
      type: county
    - id: '04'
      name: Södermanlands län
      type: county
    - id: '05'
