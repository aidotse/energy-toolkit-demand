      type: county
    - id: '06'
      name: Jönköpings län
      type: county
    - id: '07'
      name: Kronobergs län
      type: county
    - id: '08'
      name: Kalmar län
      type: county
    - id: '09'
      name: Gotlands län
      type: county
    - id: '10'
      name: Blekinge län
      type: county
    - id: '12'
      name: Skåne län
      type: county
    - id: '13'
      name: Hallands län
      type: county
    - id: '14'
      name: Västra Götalands län
      type: county
    - id: '17'
      name: Värmlands län
      type: county
    - id: '18'
      name: Örebro län
      type: county
    - id: '19'
      name: Västmanlands län
      type: county
    - id: '20'
      name: Dalarnas län
      type: county
    - id: '21'
      name: Gävleborgs län
      type: county
    - id: '22'
      name: Västernorrlands län
      type: county
    - id: '23'
      name: Jämtlands län
      type: county
    - id: '24'
      name: Västerbottens län
      type: county
    - id: '25'
      name: Norrbottens län
      type: county
generator:
  rowGroupSize: 100000
  partitionKeys:
    - scenario_id
    - geography
    - segment
    - timestamp_year
  profiles:
    noise_amplitude: 0.02  # ±2% random variation per year
    noise_seed: 42         # Random seed for reproducibility
api:
  resolutions:
    - 1h
    - 1w
    - 1M
    - 1Y
  aggregations:
    - sum
    - mean

# Independent parameter system (Strategy 2)
# Each parameter generates segment-only parquet files
# API combines them at query time
parameters:
  strategy: 2                          # 1=precomputed, 2=independent, 3=query-time
  baseScenario: 'Beslutad Policy'      # Base for parameter calculations

  definitions:
    # Pattern: {segment}_{type} where type is 'growth' or 'flex'
    housing_growth:
      type: independent
      description: "Housing demand growth rate"
      segments: [housing]
      geographies: all
      how: multiply
      values:
        - index: 0
          label: "Baseline"
          curve: null
        - index: 1
          label: "Low"
          curve:
            file: generator/input/scenarios/housing_growth/curves.parquet
            filter: "index == 1"
        - index: 2
          label: "Medium"
          curve:
            file: generator/input/scenarios/housing_growth/curves.parquet
            filter: "index == 2"
        - index: 3
          label: "High"
          curve:
            file: generator/input/scenarios/housing_growth/curves.parquet
            filter: "index == 3"

    housing_flex:
      type: independent
      description: "Housing demand flexibility"
      segments: [housing]
      geographies: all
      how: multiply
      values:
        - index: 0
          label: "None"
          curve: null
        - index: 1
          label: "Low"
          curve:
            file: generator/input/scenarios/housing_flex/curves.parquet
            filter: "index == 1"
        - index: 2
          label: "High"
          curve:
            file: generator/input/scenarios/housing_flex/curves.parquet
            filter: "index == 2"

    transport_growth:
